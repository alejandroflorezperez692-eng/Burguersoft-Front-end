services:
    frontend:
        build:
            context: .
            dockerfile: .docker/node/Dockerfile
        container_name: burguersoft_frontend
        restart: unless-stopped
        working_dir: /app
        ports:
            - "${VITE_PORT:-5173}:5173"
        volumes:
            - ./:/app:cached
            - /app/node_modules
        environment:
            - CHOKIDAR_USEPOLLING=true
        networks:
            - burguersoft_network

networks:
    burguersoft_network:
        external: true
