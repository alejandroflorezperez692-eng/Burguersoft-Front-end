<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bunTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3A8"/>
      <stop offset=".55" stop-color="#F5B95C"/>
      <stop offset="1" stop-color="#D67F1F"/>
    </linearGradient>
    <linearGradient id="bunBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C46B"/>
      <stop offset="1" stop-color="#B45F14"/>
    </linearGradient>
    <linearGradient id="patty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A452B"/>
      <stop offset="1" stop-color="#3A1D10"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE066"/>
      <stop offset="1" stop-color="#F09B00"/>
    </linearGradient>
    <linearGradient id="tomato" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7B6B"/>
      <stop offset="1" stop-color="#C1271B"/>
    </linearGradient>
    <linearGradient id="lettuce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A5EC7E"/>
      <stop offset="1" stop-color="#37A024"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sombra -->
  <ellipse cx="32" cy="56" rx="22" ry="4" fill="#000" opacity=".22"/>
  <!-- halo IA sutil -->
  <circle cx="51" cy="12" r="10" fill="url(#glow)"/>

  <!-- pan inferior -->
  <path d="M12 44 Q12 54 32 54 Q52 54 52 44 L52 42 L12 42 Z" fill="url(#bunBot)"/>
  <path d="M12 42 L52 42 L52 44.5 L12 44.5 Z" fill="#8A4A12" opacity=".55"/>

  <!-- carita kawaii en el pan inferior (parpadea con SMIL) -->
  <g>
    <ellipse cx="21" cy="50" rx="2.2" ry="1.3" fill="#FF9D8A" opacity=".75"/>
    <ellipse cx="43" cy="50" rx="2.2" ry="1.3" fill="#FF9D8A" opacity=".75"/>
    <ellipse cx="25" cy="48.3" rx="2.1" ry="2.1" fill="#3A1D10">
      <animate attributeName="ry" values="2.1;2.1;0.15;2.1;2.1" keyTimes="0;.86;.92;.97;1" dur="4.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="39" cy="48.3" rx="2.1" ry="2.1" fill="#3A1D10">
      <animate attributeName="ry" values="2.1;2.1;0.15;2.1;2.1" keyTimes="0;.86;.92;.97;1" dur="4.2s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="25.7" cy="47.6" r=".7" fill="#fff">
      <animate attributeName="r" values=".7;.7;.1;.7;.7" keyTimes="0;.86;.92;.97;1" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="39.7" cy="47.6" r=".7" fill="#fff">
      <animate attributeName="r" values=".7;.7;.1;.7;.7" keyTimes="0;.86;.92;.97;1" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <path d="M28.8 50.6 Q32 53.2 35.2 50.6" fill="none" stroke="#5B2E14" stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <!-- carne -->
  <rect x="10" y="36.5" width="44" height="7" rx="3.5" fill="url(#patty)"/>
  <g fill="#2A130A" opacity=".5">
    <circle cx="18" cy="39.5" r="1"/>
    <circle cx="26" cy="40.3" r=".9"/>
    <circle cx="34" cy="39.3" r="1.1"/>
    <circle cx="42" cy="40.2" r=".9"/>
    <circle cx="47" cy="39" r=".8"/>
  </g>
  <g fill="#A06A45" opacity=".6">
    <circle cx="21" cy="38.4" r=".7"/>
    <circle cx="31" cy="38.6" r=".7"/>
    <circle cx="39" cy="38.3" r=".7"/>
  </g>

  <!-- queso con goteo -->
  <path d="M8 33 L56 33 L56 36 L48 36 L46.5 40.5 L43 36 L14 36 Z" fill="url(#cheese)" stroke="#B96A00" stroke-width=".8" stroke-linejoin="round"/>

  <!-- tomate -->
  <rect x="13" y="30" width="38" height="4.4" rx="2.2" fill="url(#tomato)"/>
  <rect x="16" y="30.8" width="20" height="1.2" rx=".6" fill="#fff" opacity=".35"/>

  <!-- lechuga ondulada -->
  <path d="M7 27 Q11 23.5 15 27 Q19 30.5 23 27 Q27 23.5 31 27 Q35 30.5 39 27 Q43 23.5 47 27 Q51 30.5 55 27 L57 29.5 Q53 33 49 30 Q45 27 41 30 Q37 33 33 30 Q29 27 25 30 Q21 33 17 30 Q13 27 9 30 Z" fill="url(#lettuce)" stroke="#1F7A12" stroke-width=".8" stroke-linejoin="round"/>

  <!-- pan superior -->
  <path d="M10 27 Q10 10 32 10 Q54 10 54 27 Q54 28.5 52.5 28.5 L11.5 28.5 Q10 28.5 10 27 Z" fill="url(#bunTop)" stroke="#9A5410" stroke-width="1"/>
  <!-- brillo del pan -->
  <ellipse cx="23" cy="17.5" rx="8" ry="3.4" fill="#fff" opacity=".45" transform="rotate(-12 23 17.5)"/>
  <!-- semillas de ajonjolí -->
  <g fill="#FFF6DC" stroke="#9A5410" stroke-width=".6">
    <ellipse cx="24" cy="20" rx="2.1" ry="1.2" transform="rotate(-18 24 20)"/>
    <ellipse cx="32" cy="17.5" rx="2.1" ry="1.2" transform="rotate(8 32 17.5)"/>
    <ellipse cx="40" cy="20.5" rx="2.1" ry="1.2" transform="rotate(20 40 20.5)"/>
    <ellipse cx="28" cy="24" rx="2" ry="1.1" transform="rotate(-6 28 24)"/>
    <ellipse cx="36.5" cy="24.2" rx="2" ry="1.1" transform="rotate(12 36.5 24.2)"/>
    <ellipse cx="20" cy="24.5" rx="1.7" ry="1" transform="rotate(-24 20 24.5)"/>
    <ellipse cx="44.5" cy="24.8" rx="1.7" ry="1" transform="rotate(24 44.5 24.8)"/>
  </g>

  <!-- destellos IA (titilan) -->
  <g fill="#E0F2FE" stroke="#0284C7" stroke-width=".7">
    <path d="M51 5 L52.1 8 L55 9 L52.1 10 L51 13 L49.9 10 L47 9 L49.9 8 Z">
      <animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="56.5" cy="15.5" r="1.4" fill="#E0F2FE" stroke="#0284C7" stroke-width=".6">
    <animate attributeName="opacity" values="1;.3;1" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
</svg>
